<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BrandWorks KWT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .card {
            text-align: center;
            background: #020617;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            color: #38bdf8;
        }

        p {
            margin-top: 12px;
            font-size: 1.1rem;
            color: #cbd5f5;
        }

        footer {
            margin-top: 25px;
            font-size: 0.9rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Hello 👋</h1>
        <p>Welcome to <strong>BrandWorks KWT</strong></p>
        <footer>
            Powered by GitHub Pages
        </footer>
    </div>

</body>
</html>
